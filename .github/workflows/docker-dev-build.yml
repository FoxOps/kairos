name: Docker Dev Build

# Manual only, same philosophy as docker-release.yml - never triggered by
# a push (this repo is private, GitHub Actions minutes are metered past
# the free monthly quota, see tests.yml). Run from the Actions tab (or
# `gh workflow run docker-dev-build.yml --ref <branch>`), picking any
# branch EXCEPT main - the require-not-main job below refuses to run
# otherwise. main is production; it only ever gets a clean version
# (docker-release.yml, no build metadata) - a dev build with build
# metadata off main would be a contradiction in terms.
#
# Unlike a release image, a dev build's tag/version is disposable and
# exists purely to answer "is this test container actually running the
# latest commit on this branch?" - see Docs/reference/VERSIONING.md.
on:
  workflow_dispatch: {}

jobs:
  # Inverse of docker-release.yml's require-main - a dev build off main
  # would tag main's own commit with build metadata it should never
  # carry. Fails loudly so whoever triggered this from the wrong ref
  # gets a clear reason instead of a silent skip.
  require-not-main:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::docker-dev-build.yml must not be run from main - main is production and never carries build metadata. Use docker-release.yml instead." >&2
          exit 1

  run-tests:
    needs: require-not-main
    uses: ./.github/workflows/tests.yml

  docker-build-push:
    needs: run-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Base version straight from the source of truth
      # (APP_VERSION_DEFAULT), then append SemVer build metadata
      # (`+dev.<run number>.<short sha>`) - the `+` syntax is part of
      # SemVer itself and never affects precedence/ordering, so this
      # never collides with or outranks a real release version. The run
      # number is a free, already-unique, monotonically increasing
      # counter (no hand-maintained counter to keep in sync across
      # branches); the short SHA is what actually proves the running
      # container matches a specific commit.
      - name: Compute dev build version
        id: version
        # github.ref_name/run_number come through env:, not interpolated
        # directly into the script, and are quoted throughout - standard
        # precaution against ref-injection even though git itself
        # already rejects the shell metacharacters that would matter
        # here in a branch name.
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base_version=$(grep -oP '(?<=APP_VERSION_DEFAULT = ")[^"]+' app/utils/health.py)
          if [ -z "$base_version" ]; then
            echo "Could not extract APP_VERSION_DEFAULT from app/utils/health.py" >&2
            exit 1
          fi
          short_sha=$(git rev-parse --short HEAD)
          full_version="${base_version}+dev.${RUN_NUMBER}.${short_sha}"
          # Docker tags can't contain "+" - the image tag uses the
          # branch name and short SHA instead; the "+..." form only
          # ever shows up inside the image itself, at /version and in
          # the footer.
          branch_slug=$(echo "$REF_NAME" | tr -c 'a-zA-Z0-9' '-' | tr 'A-Z' 'a-z')
          echo "full_version=${full_version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=dev-${branch_slug}-${short_sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.full_version }}
          # Never :latest - that tag is reserved for the last
          # docker-release.yml (production) build. The exact
          # dev-<branch>-<sha> tag pins one specific build; the floating
          # `dev` tag always points at whichever dev build ran most
          # recently (any branch) - convenient for "just give me the
          # newest test image" without knowing the exact tag, same idea
          # as `:latest` but scoped to dev builds only, never mixed with
          # it.
          tags: |
            ghcr.io/foxops/kairos:${{ steps.version.outputs.image_tag }}
            ghcr.io/foxops/kairos:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Keeps the ghcr.io/foxops/kairos package from growing unbounded - dev
  # builds are disposable and this workflow can be run often. Deletes
  # every dev-<branch>-<sha> version past the 5 newest.
  #
  # A hand-rolled `gh api` script, not actions/delete-package-versions@v5
  # (used here previously) - real incident: that action deleted a
  # production release version (a bare-SemVer/`:latest`-tagged one), even
  # though `ignore-versions` was configured to protect exactly that
  # pattern. Root cause, confirmed via that run's own log: the action
  # silently ran with `num-old-versions-to-delete: 1` - an input this
  # workflow never set, on top of `min-versions-to-keep: 5` - the two
  # inputs combine in that action in an undocumented, non-obvious way.
  # Its log is also opaque either way ("Total versions deleted till now:
  # 3", no per-item detail), so the exact mechanism that let a protected
  # version through was never fully diagnosable from the outside.
  #
  # This replacement is deliberately the opposite shape: an explicit
  # allow-list, not a regex deny-list. It only ever *considers* a
  # version for deletion if every one of its tags matches `^dev-` - a
  # version carrying `latest`, a bare release tag, or the floating `dev`
  # tag is excluded from the candidate set before any counting happens,
  # so it structurally cannot be selected no matter how sorting/counting
  # behaves. Every kept/deleted version is logged individually.
  cleanup-old-dev-builds:
    needs: docker-build-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old dev-build package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          owner="FoxOps"
          package="kairos"
          keep=5

          # `--slurp` (one JSON array of all pages) and `--jq` are
          # mutually exclusive on `gh api` - flatten with a separate
          # `jq add` pass instead.
          versions=$(gh api --paginate --slurp \
            "/users/${owner}/packages/container/${package}/versions?per_page=100" \
            | jq 'add')

          # Only a version whose tags are ALL "dev-*" is even a
          # candidate - one stray protected tag on a version excludes it
          # entirely, never just that one tag.
          candidates=$(jq '
            map(select(
              ((.metadata.container.tags // []) | length) > 0
              and (.metadata.container.tags | all(test("^dev-")))
            ))
            | sort_by(.created_at) | reverse
          ' <<<"$versions")

          total=$(jq 'length' <<<"$candidates")
          echo "Found $total dev-build version(s) eligible for cleanup."

          jq -r "to_entries[] | select(.key < $keep) | \"KEEP  \(.value.id)  \(.value.metadata.container.tags | join(\",\"))\"" <<<"$candidates"

          to_delete=$(jq -c ".[$keep:]" <<<"$candidates")
          delete_count=$(jq 'length' <<<"$to_delete")
          echo "Deleting $delete_count version(s) past the $keep newest..."

          jq -r '.[] | "\(.id)\t\(.metadata.container.tags | join(","))"' <<<"$to_delete" |
          while IFS=$'\t' read -r version_id tags; do
            echo "DELETE $version_id  $tags"
            gh api --method DELETE \
              "/users/${owner}/packages/container/${package}/versions/${version_id}"
          done
